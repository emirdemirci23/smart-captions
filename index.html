<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Captions</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>Smart Captions</h1>
    <span class="header-right"><span id="seqName" class="muted"></span><span id="updateStatus" class="update"></span></span>
  </header>

  <details open>
    <summary>1 · Transcript</summary>
    <div class="section">
      <label class="field">
        <span>Timed transcript <em class="muted">(SRT, VTT, JSON, timestamped text – or drag a file onto the panel)</em></span>
        <div class="filerow">
          <button class="btn small" id="timedBtn" type="button">Choose file…</button>
          <input type="file" id="timedFile" hidden>
          <span id="timedName" class="muted ellipsis">No file chosen</span>
        </div>
      </label>
      <label class="field">
        <span>Corrected script <em class="muted">(optional – plain text; its words replace the transcript's words)</em></span>
        <div class="filerow">
          <button class="btn small" id="scriptBtn" type="button">Load .txt…</button>
          <input type="file" id="scriptFile" hidden>
          <button class="btn small ghost" id="clearScript" type="button">Clear</button>
        </div>
        <textarea id="scriptText" rows="4" placeholder="Paste the script here (optional). A line break = preferred break, | = forced break."></textarea>
      </label>
      <label class="field">
        <span>Audio for precise sync <em class="muted">(optional – WAV of the same sequence/clip you transcribed)</em></span>
        <div class="filerow">
          <button class="btn small" id="audioBtn" type="button">Choose audio…</button>
          <input type="file" id="audioFile" hidden>
          <button class="btn small ghost" id="clearAudio" type="button">Clear</button>
          <span id="audioName" class="muted ellipsis">No audio</span>
        </div>
      </label>
      <div id="sourceInfo" class="info"></div>
    </div>
  </details>

  <details open>
    <summary>2 · Caption rules</summary>
    <div class="section grid">
      <label class="field"><span>Min words</span><input type="number" id="minWords" min="1" max="30" step="1"></label>
      <label class="field"><span>Max words</span><input type="number" id="maxWords" min="1" max="40" step="1"></label>
      <label class="field"><span>Max characters / line</span><input type="number" id="maxCharsPerLine" min="10" max="100" step="1"></label>
      <label class="field"><span>Lines</span>
        <select id="maxLines"><option value="1">1 line</option><option value="2">2 lines</option></select>
      </label>
      <label class="field"><span>Min duration (s)</span><input type="number" id="minDuration" min="0" max="10" step="0.1"></label>
      <label class="field"><span>Max duration (s)</span><input type="number" id="maxDuration" min="1" max="30" step="0.5"></label>
      <label class="field"><span>Split at pauses over (s)</span><input type="number" id="pauseSplit" min="0.1" max="10" step="0.1"></label>
      <label class="field"><span>Close gaps under (s)</span><input type="number" id="closeGapsUnder" min="0" max="5" step="0.1"></label>
      <label class="field"><span>Gap between captions (frames)</span><input type="number" id="gapFrames" min="0" max="30" step="1"></label>
      <label class="field"><span>Language rules</span>
        <select id="language"></select>
      </label>
      <label class="check span2"><input type="checkbox" id="continuous"> Continuous – each caption stays until the next one starts</label>
      <label class="check span2"><input type="checkbox" id="splitSentences"> One sentence per caption (short sentences may go under the minimum)</label>
    </div>
  </details>

  <details open>
    <summary>3 · Keep together</summary>
    <div class="section">
      <label class="field">
        <span>Phrases that must stay in one caption <em class="muted">(one per line)</em></span>
        <textarea id="phrases" rows="5" spellcheck="false"></textarea>
      </label>
      <div class="row wrap">
        <label class="check"><input type="checkbox" id="protectNames"> Names (New York, Emma Stone)</label>
        <label class="check"><input type="checkbox" id="protectNumbers"> Numbers + units (10 minutes)</label>
      </div>
      <button class="btn small ghost" id="resetPhrases" type="button">Reset to language defaults</button>
    </div>
  </details>

  <details open>
    <summary>4 · Placement</summary>
    <div class="section grid">
      <label class="field"><span>Transcript time 0 is at</span>
        <select id="alignMode">
          <option value="sequence">Sequence start</option>
          <option value="clip">Selected clip's media start</option>
          <option value="playhead">Playhead</option>
        </select>
      </label>
      <label class="field"><span>Extra offset (s)</span><input type="number" id="offset" step="0.04"></label>
    </div>
  </details>

  <div class="actions">
    <button class="btn primary" id="createBtn" type="button" disabled>Create caption track</button>
    <button class="btn" id="saveBtn" type="button" disabled>Save SRT…</button>
  </div>
  <div id="status" class="status" role="status"></div>

  <section class="preview">
    <div class="preview-head">
      <h2>Preview</h2>
      <span id="stats" class="muted"></span>
    </div>
    <ol id="captionList" class="captions"></ol>
  </section>

  <script src="js/caption-engine.js"></script>
  <script src="js/updater.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
